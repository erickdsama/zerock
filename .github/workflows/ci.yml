name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: make vet

      # Guards the client/server split: if the lean CLI ever imports the server
      # again, this fails here rather than in a release that quietly doubled in
      # size.
      - name: boundary
        run: make boundary

      - name: test
        run: make test

      # The server multiplexes concurrent streams, so this is the run that
      # matters most.
      - name: race
        run: make race

      - name: build all binaries
        run: make build build-cli build-tray

      # Every release target except the macOS tray cross-compiles from here, so
      # a Windows or macOS build break shows up on the pull request, not at
      # release time.
      - name: cross-compile release targets
        run: make release

  # The tray widget is the one thing with a platform-specific build: cgo and
  # Cocoa on macOS. Building it there is the only way to know it still compiles.
  tray-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build tray
        run: make build-tray && ./bin/zerock-tray --version
